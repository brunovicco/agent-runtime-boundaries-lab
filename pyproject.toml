[project]
name = "agent-runtime-boundaries-lab"
version = "0.2.0"
description = "Reference architecture for composing LangGraph, Agno and CrewAI without splitting ownership of state"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Bruno Vicco" }]
dependencies = [
    "a2a-otel-kit>=0.6.0,<0.7",
    "agno[sqlite]>=3.0.9,<3.1",
    "crewai>=1.15.21,<1.16",
    "fastapi>=0.116,<1",
    "governed-llm-gateway-client==1.1.0",
    "governed-llm-gateway-contracts==1.1.0",
    "httpx>=0.28.1,<0.29",
    "langgraph>=1.2.11,<1.3",
    "langgraph-checkpoint-postgres>=3.1.2,<3.2",
    "opentelemetry-api>=1.43,<2",
    "openai>=2.9,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.8,<3",
    "structlog>=25.1,<26",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8",
    "mypy>=1.16",
    "pip-audit>=2.9",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv.sources]
governed-llm-gateway-client = { git = "https://github.com/brunovicco/governed-llm-gateway.git", rev = "7d7e2e3840719acd257b1c25c19f8ce4a84592d8", subdirectory = "packages/gateway-client" }
governed-llm-gateway-contracts = { git = "https://github.com/brunovicco/governed-llm-gateway.git", rev = "7d7e2e3840719acd257b1c25c19f8ce4a84592d8", subdirectory = "packages/gateway-contracts" }

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime_boundaries"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ANN", "D", "S"]
ignore = ["ANN401", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "ANN"]
"scripts/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "agno.*",
    "crewai.*",
    "a2a_otel_kit.*",
    "langgraph.*",
    "langgraph.checkpoint.postgres.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -m 'not integration'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires external runtime infrastructure",
    "contract: verifies cross-runtime contracts",
    "e2e: verifies the full hybrid path",
]

[tool.coverage.run]
branch = true
source = ["src/agent_runtime_boundaries"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.bandit]
exclude_dirs = ["tests"]
skips = []

[tool.engineering-harness.quality]
source-roots = ["src"]
test-roots = ["tests"]

[tool.engineering-harness.architecture]
source-roots = ["src"]
clean-architecture = true
