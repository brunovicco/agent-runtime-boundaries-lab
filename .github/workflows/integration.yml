name: integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  postgres-resume-proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agent_runtime_boundaries
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_runtime_boundaries"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agent_runtime_boundaries
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run pytest -m integration -q
